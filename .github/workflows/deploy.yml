name: South Rally Production Deployment

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eisendev/southrally

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,value=${{ github.sha }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize production database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Upload deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "/home/${{ secrets.DROPLET_USER }}/south-rally"

      - name: SSH and Deploy to DigitalOcean Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          PAYMONGO_SECRET_KEY: ${{ secrets.PAYMONGO_SECRET_KEY }}
          PAYMONGO_WEBHOOK_SECRET: ${{ secrets.PAYMONGO_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 45s
          command_timeout: 10m
          envs: DATABASE_URL,DIRECT_URL,AUTH_SECRET,AUTH_GOOGLE_ID,AUTH_GOOGLE_SECRET,PAYMONGO_SECRET_KEY,PAYMONGO_WEBHOOK_SECRET,RESEND_API_KEY,RESEND_FROM_EMAIL,GHCR_TOKEN
          script: |
            set -eu
            cd ~/south-rally

            umask 077
            {
              printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
              printf 'DIRECT_URL=%s\n' "$DIRECT_URL"
              printf 'AUTH_SECRET=%s\n' "$AUTH_SECRET"
              printf 'AUTH_TRUST_HOST=true\n'
              printf 'AUTH_URL=https://southrally.novaryn.com\n'
              printf 'NEXTAUTH_URL=https://southrally.novaryn.com\n'
              printf 'AUTH_GOOGLE_ID=%s\n' "$AUTH_GOOGLE_ID"
              printf 'AUTH_GOOGLE_SECRET=%s\n' "$AUTH_GOOGLE_SECRET"
              printf 'PAYMONGO_SECRET_KEY=%s\n' "$PAYMONGO_SECRET_KEY"
              printf 'PAYMONGO_WEBHOOK_SECRET=%s\n' "$PAYMONGO_WEBHOOK_SECRET"
              printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
              printf 'RESEND_FROM_EMAIL=%s\n' "$RESEND_FROM_EMAIL"
            } > .env

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
